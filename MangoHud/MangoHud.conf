################### VISUAL ###################

position=top-right
# offset_x=130
offset_y=10

### pre defined presets
-1 = default
 0 = no display
 1 = fps only
preset=-1

### Display the current GPU information
## Note: gpu_mem_clock and gpu_mem_temp also need "vram" to be enabled
gpu_stats
gpu_temp

### Display the current CPU information
cpu_stats
cpu_temp

### Display system vram / ram
vram
ram

### Display FPS and frametime
fps
fps_text=FPS
fps_color_change
fps_color=F38BA8,F9E2AF,A6E3A1
frametime=0
frame_timing=0

### Display GPU throttling status based on Power, current, temp or "other"
## Only shows if throttling is currently happening
throttling_status

### Change default font (set location to TTF/OTF file)
## Set font for the whole hud
# font_file=/usr/share/fonts/jetbrains-mono-fonts/JetBrainsMonoNerdFontMono-Regular.ttf

### Outline text
text_outline
# text_outline_color = 000000
# text_outline_thickness = 1.5

### Color customization
text_color=CDD6F4
gpu_color=A6E3A1
cpu_color=89B4FA
vram_color=CBA6F7
ram_color=F5C2E7
engine_color=F38BA8
io_color=94E2D5
frametime_color=A6E3A1
background_color=1E1E2E
media_player_color=F2CDCD
wine_color=F38BA8
battery_color=FAB387
network_color=F5C2E7
horizontal_separator_color=585B70
background_alpha=0

################ INTERACTION #################

reload_cfg=Shift_R+R
toggle_hud=Shift_R+O
toggle_preset=Shift_R+T
