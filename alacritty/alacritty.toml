[general]
import = ["~/.config/alacritty/env.toml", "~/.config/alacritty/binds.toml"]

[terminal.shell]
program = "/usr/bin/fish"

[env]
TERM = "xterm-256color"

[window]
opacity = 0.9
padding = { x = 12, y = 12 }

[font.normal]
family = "JetBrainsMono Nerd Font Propo"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Propo"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Propo"
style = "Italic"

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[colors.cursor]
cursor = "#f5e0dc"
