################
### MONITORS ###
################

monitor = eDP-1, 1920x1080, 0x0, 1.00
monitor = , preferred, auto, 1, mirror, eDP-1

#################
### AUTOSTART ###
#################

exec-once = hyprpaper
exec-once = hypridle
exec-once = waybar
exec-once = nm-applet
exec-once = swaync -c ~/.config/swaync/config.json -swb

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,32

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(9ccfd8ff)
    col.inactive_border = rgba(3d3d3dff)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 5
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = menu_decel, 0.1, 1, 0, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    #animation = workspaces, 1, 10, menu_decel, slide
    animation = workspaces, 0, 1, almostLinear, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 1
    disable_hyprland_logo = true
}

#############
### INPUT ###
#############

input {
    kb_layout = hu
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0
    accel_profile = "flat"

    touchpad {
        natural_scroll = false
    }
}

cursor {
    no_hardware_cursors = true
}

###################
### KEYBINDINGS ###
###################

binds {
    drag_threshold = 10
}

$mod = ALT

bindm = $mod, mouse:272, movewindow
bindc = $mod, mouse:272, togglefloating
bindm = $mod, mouse:273, resizewindow

bind = Ctrl_l, E, exec, wezterm
bind = Ctrl_l, space, exec, fuzzel
bind = SUPER, E, exec, nautilus

bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod, LEFT, movefocus, l
bind = $mod, RIGHT, movefocus, r

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, LEFT, movewindow, l
bind = $mod SHIFT, RIGHT, movewindow, r
bind = $mod SHIFT, UP, movewindow, u
bind = $mod SHIFT, DOWN, movewindow, d

bind = $mod, T, exec, ~/.config/hypr/scripts/toggle_floating.sh

bind = $mod SHIFT, SPACE, togglesplit
bind = $mod, V, togglesplit

bind = $mod, F, fullscreen
bind = $mod, W, killactive

bind = $mod, Q, togglespecialworkspace, magic
bind = $mod, Q, movetoworkspace, +0
bind = $mod, Q, togglespecialworkspace, magic
bind = $mod, Q, movetoworkspace, special:magic
bind = $mod, Q, togglespecialworkspace, magic

# bind = $mod SHIFT, Q, exec, hyprctl dispatch exit
bind = $mod SHIFT, R, exec, hyprctl reload
# bind = $mod SHIFT, E, exit

bind = $mod, A, workspace, r-1
bind = $mod, D, workspace, r+1

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod, R, submap, resize
submap = resize
binde = , right, resizeactive, 20 0
binde = , left, resizeactive, -20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20
bind = , escape, submap, reset
bind =  $mod, R, submap, reset
submap = reset

bind = $mod SHIFT, P, submap, pause
submap = pause
bind =  $mod SHIFT, P, submap, reset
submap = reset

# Ignore maximize requests from apps
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = float,class:^(org.gnome.Nautilus)$
windowrulev2 = float,class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = move 1100 40,class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = size 800 400,class:^(org.pulseaudio.pavucontrol)$
