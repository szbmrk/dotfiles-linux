background {
    monitor =
    path = /home/szobo/Pictures/wallpapers/car-1.png
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(192, 202, 245, 0.75)
    inner_color = rgba(26, 27, 28, 0.5)
    font_color = rgba(192, 202, 245, 0.75)
    fade_on_empty = false
    rounding = -1
    check_color = rgb(122, 162, 247)
    fail_color = rgb(191, 97, 106)
    placeholder_text = <i><span foreground="##7aa2f7">Input Password...</span></i>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%Y. %m. %d.")"
  color = rgba(192, 202, 245, 0.75)
  font_size = 22
  font_family = JetBrains Mono
  position = 0, 300
  halign = center
  valign = center
}

label {
    monitor =
    text = Hi there, $USER!
    color = rgba(192, 202, 245, 0.75)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}

label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%H:%M")"
  color = rgba(192, 202, 245, 0.75)
  font_size = 95
  font_family = JetBrains Mono Extrabold
  position = 0, 200
  halign = center
  valign = center
}
